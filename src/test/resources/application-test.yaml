spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:test-data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  shell:
    interactive:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile,env,beans
  endpoint:
    health:
      show-details: always
    logfile:
      external-file: logs/spring-jdbc-homework.log

logging:
  file:
    name: logs/spring-jdbc-homework.log
