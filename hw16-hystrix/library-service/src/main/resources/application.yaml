spring:
  application:
    name: spring-jdbc-homework
  datasource:
    url: jdbc:h2:file:~/librarydb;AUTO_SERVER=true;IFEXISTS=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
  shell:
    interactive:
      enabled: false

logging:
  level:
    org.springframework.jdbc: DEBUG
